# SESKit documentation site.
#
#   uv run --group docs mkdocs serve          # by hand, at :8000
#   uv run --group docs mkdocs build --strict # what CI runs
#
# MkDocs rather than Docusaurus, VitePress or Starlight because §5 forbids
# Node, npm and a build step. This is a Python dependency in the workspace that
# already exists, and it is what FastAPI, Pydantic, uv and Typer use - which
# makes it familiar to exactly the developer who would adopt SESKit.

site_name: SESKit
site_description: A Python-native developer email platform built on Amazon SES.
site_url: https://otitodev.github.io/seskit/
repo_url: https://github.com/Otitodev/seskit
repo_name: Otitodev/seskit
edit_uri: edit/main/docs/
copyright: MIT licensed.

# --strict turns warnings into errors, and a broken internal link is a warning.
# Documentation that links to a page that does not exist is worse than
# documentation that does not mention it.
strict: true

theme:
  name: material
  language: en
  # The pale variant, not the blue one. Material puts this on the header bar,
  # which is the brand blue in the light theme - a blue mark on it measures
  # 1.00:1, because it is the same colour. The pale mark reads on the light bar
  # (4.34:1) and on the dark one, so one asset covers both themes.
  #
  # Not a wordmark either: the supplied horizontal logo carries a baked white
  # background that would show as a white block against the bar.
  logo: assets/seskit-icon-white.png
  favicon: assets/favicon.png
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    # Three states, matching the dashboard's own theme toggle: an explicit
    # light, an explicit dark, and following the system by default.
    # "custom" on all three, including this one. It is the state a first-time
    # visitor lands in, and leaving it unset does not mean "inherit" - Material
    # falls back to indigo and emits data-md-color-primary="indigo", whose
    # attribute selector outranks the :root rule in extra.css. The brand colour
    # would then apply everywhere except the view most people actually see.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow system

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Otitodev/seskit
      name: SESKit on GitHub

plugins:
  # Client-side, no Algolia and no third party. Same reasoning as vendoring
  # Chart.js instead of loading it from a CDN: a self-hosted product whose
  # documentation phones out on every page load argues against itself.
  - search

  # llms.txt is a curated index with one line per page, so an agent can find
  # the right page without crawling the site. llms-full.txt is the whole corpus
  # in a single fetch, for one that would rather read everything.
  #
  # Generated at build time rather than committed, which is the opposite of the
  # decision taken for the API reference - deliberately. That file is small and
  # its diffs are worth reading in review; llms-full.txt is every page
  # concatenated, so committing it would put a copy of the entire documentation
  # in the diff of any change to any page.
  #
  # The descriptions are written here rather than pulled from each page's first
  # paragraph, because the job of this file is to let something decide *not* to
  # open a page. That needs a sentence about what the page answers, which is a
  # different sentence from the one a page opens with.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        SESKit is a self-hosted, Python-native email platform built on Amazon
        SES. You run the server yourself on your own AWS account; the `seskit`
        package on PyPI is an optional thin client for talking to it over HTTP,
        and currently reserves the name without implementing a client.
      sections:
        Start here:
          - index.md: What SESKit is, and the distinction between the server you run and the client you install.
          - getting-started/installation.md: Running the server with Docker Compose, and the non-Docker path.
          - getting-started/first-email.md: Sending through Mailpit in a minute with no AWS account; what "queued" means; idempotency keys.
          - getting-started/sending-from-your-app.md: Calling a running instance from your own code over HTTP, with error handling and rate limits.
          - getting-started/dashboard-tour.md: What each dashboard page shows.
        Guides:
          - guides/no-aws-account-yet.md: The path from no AWS account to a verified sender, and what SES costs.
          - guides/connect-aws.md: Pointing SESKit at an AWS account. Credentials are resolved by boto3 and never stored.
          - guides/iam-policies.md: The exact IAM permissions, why each is needed, and how to grant them in stages.
          - guides/verify-a-sender.md: Verifying a domain or a single address; DKIM, SPF and DMARC.
          - guides/ses-sandbox.md: What the SES sandbox restricts and how to leave it.
          - guides/delivery-events.md: How SES reports deliveries and bounces, SQS versus HTTPS ingestion, and open/click tracking.
          - guides/webhooks.md: Registering endpoints, verifying the HMAC signature, retries, and the SSRF rules.
          - guides/metrics.md: The six counts and five rates, and what each rate divides by.
        Reference:
          - reference/api.md: Every HTTP endpoint, generated from the OpenAPI schema.
          - reference/sdk.md: The Python SDK, why it is optional, and that it is not written yet.
          - reference/configuration.md: Every environment variable, its default, and its effect.
          - reference/events.md: The event vocabulary, webhook payload shape, and bounce types.
          - reference/errors.md: Every error type, which are worth retrying, and which are not.
        Operating SESKit:
          - operating/deploying.md: What has to run, the required environment, and health checks.
          - operating/upgrading.md: Migration ordering, and why a downgrade is not a rollback.
          - operating/backup.md: What to back up, and that a dump carries the webhook signing secrets.
          - operating/troubleshooting.md: Common failures ordered by how often each is the cause.
        Design notes:
          - design/why-ses.md: Why SESKit builds on SES directly rather than abstracting over providers.
          - design/security-model.md: Credentials, signatures, SSRF defence, tenancy, and what is not covered yet.
          - design/prior-art.md: What was learned from comparable projects and the requirements it produced.
          - design/system.md: Design tokens, components, and the rules for changing the dashboard.
          - design/brief.md: The visual direction for the dashboard.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# Contributor documentation, not user documentation. It belongs to
# CONTRIBUTING.md and is deliberately absent from the nav rather than absent
# from the repository.
not_in_nav: |
  commit-conventions.md

nav:
  - Home: index.md
  - Getting started:
      - Install and run: getting-started/installation.md
      - Your first email: getting-started/first-email.md
      - Sending from your app: getting-started/sending-from-your-app.md
      - The dashboard: getting-started/dashboard-tour.md
  - Guides:
      - No AWS account yet?: guides/no-aws-account-yet.md
      - Connect an AWS account: guides/connect-aws.md
      - IAM policies: guides/iam-policies.md
      - Verify a sender: guides/verify-a-sender.md
      - Leave the SES sandbox: guides/ses-sandbox.md
      - Delivery events: guides/delivery-events.md
      - Webhooks: guides/webhooks.md
      - Reading your metrics: guides/metrics.md
  - Reference:
      - HTTP API: reference/api.md
      - Python SDK: reference/sdk.md
      - Configuration: reference/configuration.md
      - Events and payloads: reference/events.md
      - Errors: reference/errors.md
  - Operating SESKit:
      - Deploying: operating/deploying.md
      - Upgrading and migrations: operating/upgrading.md
      - Backup and restore: operating/backup.md
      - Troubleshooting: operating/troubleshooting.md
  - Design notes:
      - Why SES-native: design/why-ses.md
      - Security model: design/security-model.md
      # Written long before this site existed, and unfindable until it gave
      # them a home. They now sit with the rest of the design notes.
      - Prior art: design/prior-art.md
      - Design brief: design/brief.md
      - Design system: design/system.md
