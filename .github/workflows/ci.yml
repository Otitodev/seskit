name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Phase 1's suite stubs its data dependencies, but these are set so the
  # settings object validates and so integration tests added in later phases
  # have live services to talk to.
  SECRET_KEY: ci-secret-key
  DATABASE_URL: postgresql+asyncpg://seskit:seskit@localhost:5432/seskit_test
  REDIS_URL: redis://localhost:6379/0
  ENVIRONMENT: local

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seskit
          POSTGRES_PASSWORD: seskit
          POSTGRES_DB: seskit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seskit -d seskit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full history to walk the range of commits in the PR.
          fetch-depth: 0

      # The git hook only protects contributors who ran the one-line setup.
      # This is the backstop that catches everyone else, before review.
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            if ! python3 scripts/check_commit_msg.py /tmp/commit-msg.txt; then
              echo "::error::Commit $(git log -1 --format=%h "$sha") has an invalid message"
              status=1
            fi
          done
          exit $status

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Catches a broken Dockerfile at PR time rather than on someone's first
      # `docker compose up`, which is the project's advertised entry point.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
