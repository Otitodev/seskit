[project]
name = "seskit-workspace"
version = "0.1.0"
description = "SESKit - a Python-native developer email platform built on Amazon SES"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# The root is a workspace container only; runtime deps live in the member packages.
dependencies = [
    "seskit-core",
    "seskit-api",
    "seskit-worker",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "alembic>=1.13",
    "moto[ses]>=5.2.3",
    "boto3-stubs[sesv2,sts]>=1.43.81",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
seskit-core = { workspace = true }
seskit-api = { workspace = true }
seskit-worker = { workspace = true }
seskit-provider-aws-ses = { workspace = true }
seskit-sdk = { workspace = true }

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point of a test file.
# S105/S106: test fixtures contain deliberately fake secrets.
# E402: conftest must set the environment before importing the app under test.
"tests/**" = ["S101", "S105", "S106", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Alembic's generated migration scripts are not worth type-checking.
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Per-test loops by default; the session-scoped database fixture opts into a
# session loop explicitly. It yields only a URL, so no live connection is
# shared across loops.
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
