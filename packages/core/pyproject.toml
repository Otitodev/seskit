[project]
name = "seskit-core"
version = "0.1.0"
description = "SESKit core: configuration, logging, persistence, and shared domain logic"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "structlog>=24.4",
    "pwdlib[argon2]>=0.2",
    "python-ulid>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seskit_core"]
