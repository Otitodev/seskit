[project]
name = "seskit-sdk"
version = "0.1.0"
description = "SESKit Python SDK - a thin client over the SESKit HTTP API (implemented in Phase 10)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seskit"]
