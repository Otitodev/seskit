[project]
name = "seskit-provider-aws-ses"
version = "0.1.0"
description = "Amazon SES provider for SESKit (implemented in Phase 4)"
requires-python = ">=3.12"
dependencies = [
    "seskit-core",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seskit_provider_aws_ses"]
