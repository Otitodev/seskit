[project]
name = "seskit-provider-aws-ses"
version = "0.1.0"
description = "Amazon SES provider for SESKit (implemented in Phase 4)"
requires-python = ">=3.12"
dependencies = [
    "seskit-core",
    "boto3>=1.35",
    # Verifying SNS signatures (§15). Present transitively through moto
    # before this, which made it look available while being a dev-only
    # dependency - the HTTPS receiver needs it in production.
    "cryptography>=43",
    # Fetching the SNS signing certificate, and answering the subscription
    # handshake. Both only ever to a host that passed assert_aws_url.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seskit_provider_aws_ses"]
