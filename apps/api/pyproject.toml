[project]
name = "seskit-api"
version = "0.1.0"
description = "SESKit API and server-rendered dashboard"
requires-python = ">=3.12"
dependencies = [
    "seskit-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "seskit-provider-aws-ses",
    "seskit-provider-smtp",
    "arq>=0.26",
    # Runtime, not development. The image has to be able to apply its own
    # migrations: a deployment that clones and runs `docker compose up` has
    # no uv, no repository checkout and no dev dependency group to borrow
    # one from.
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seskit_api"]

[tool.uv.sources]
seskit-provider-aws-ses = { workspace = true }
seskit-provider-smtp = { workspace = true }
