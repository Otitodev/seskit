[project]
name = "seskit-api"
version = "0.1.0"
description = "SESKit API and server-rendered dashboard"
requires-python = ">=3.12"
dependencies = [
    "seskit-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seskit_api"]
