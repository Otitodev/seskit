[project]
name = "seskit-worker"
version = "0.1.0"
description = "SESKit background worker (ARQ)"
requires-python = ">=3.12"
# The worker calls SES directly for the identity re-check, so it needs the
# adapter. Core must not import one, so each app that needs a provider
# depends on it itself.
dependencies = [
    "seskit-core",
    "seskit-provider-aws-ses",
    "seskit-provider-smtp",
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seskit_worker"]
